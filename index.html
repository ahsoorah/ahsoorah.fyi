<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ahsoorah.fyi</title>
<meta name="description" content="ahsoorah's bio link — enter at your own risk.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 fill=%22%23000%22/><rect x=%224%22 y=%222%22 width=%228%22 height=%222%22 fill=%22%23dc143c%22/><rect x=%222%22 y=%224%22 width=%2212%22 height=%228%22 fill=%22%23dc143c%22/><rect x=%224%22 y=%2212%22 width=%228%22 height=%222%22 fill=%22%23dc143c%22/><rect x=%225%22 y=%227%22 width=%222%22 height=%222%22 fill=%22%23000%22/><rect x=%229%22 y=%227%22 width=%222%22 height=%222%22 fill=%22%23000%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --panel:#0a0605;
    --crimson:#dc143c;
    --blood:#7a0e22;
    --ember:#ff3b57;
    --bone:#ece4d6;
    --muted:#8a4a52;
    --px: 4px; /* base pixel unit */
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--black);
    color:var(--bone);
    font-family:'VT323', monospace;
    font-size:20px;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
    position:relative;
    overflow-x:hidden;
    line-height:1.35;
  }

  /* CRT scanline + vignette overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:50;
    mix-blend-mode:overlay;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
    z-index:49;
  }

  .display{
    font-family:'Press Start 2P', monospace;
  }

  a{color:inherit;}

  .wrap{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:1;
  }

  /* ---- pixel panel: NES-style notched window ---- */
  .panel{
    background:var(--black);
    border:var(--px) solid var(--crimson);
    box-shadow:
      0 0 0 var(--px) var(--black),
      0 0 0 calc(var(--px) * 2) var(--blood),
      0 0 28px rgba(220,20,60,0.28);
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
    margin-bottom:24px;
    padding:20px;
  }

  .panel + .panel{margin-top:24px;}

  /* ---- header / title bar ---- */
  .titlebar{
    text-align:center;
    padding-bottom:6px;
  }
  .blink{
    animation:blink 1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .blink{animation:none;} }
  @keyframes blink{ 50%{opacity:0;} }

  .eyebrow{
    font-family:'Press Start 2P';
    font-size:9px;
    letter-spacing:2px;
    color:var(--muted);
    text-align:center;
    margin-bottom:10px;
  }

  /* ---- pixel sprite avatar (rendered via JS grid) ---- */
  .sprite-wrap{
    display:flex;
    justify-content:center;
    margin:4px 0 14px;
  }
  #sprite{
    display:grid;
    grid-template-columns:repeat(11, 8px);
    grid-template-rows:repeat(11, 8px);
    filter:drop-shadow(0 0 10px rgba(220,20,60,0.55));
  }
  #sprite div{width:8px;height:8px;}
  .p-off{background:transparent;}
  .p-on{background:var(--crimson);}
  .p-dark{background:var(--blood);}
  .p-eye{background:var(--black);}

  h1.name{
    font-family:'Press Start 2P';
    font-size:22px;
    text-align:center;
    color:var(--bone);
    text-shadow: 0 0 10px rgba(220,20,60,0.6), 3px 3px 0 var(--blood);
    margin:0 0 6px;
    letter-spacing:1px;
  }

  .handle{
    text-align:center;
    color:var(--crimson);
    font-size:20px;
    margin-bottom:14px;
  }

  .tagline{
    text-align:center;
    min-height:1.4em;
    color:var(--bone);
    font-size:20px;
    border-top:2px dashed var(--blood);
    border-bottom:2px dashed var(--blood);
    padding:10px 4px;
  }
  .cursor{
    display:inline-block;
    width:10px;
    background:var(--ember);
    margin-left:2px;
    animation:blink 0.8s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .cursor{animation:none; opacity:1;} }

  /* ---- section labels ---- */
  .section-label{
    font-family:'Press Start 2P';
    font-size:11px;
    color:var(--ember);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::before{content:"▸";}

  /* ---- stat bars ---- */
  .stat-row{margin-bottom:12px;}
  .stat-row:last-child{margin-bottom:0;}
  .stat-name{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    margin-bottom:4px;
    color:var(--bone);
  }
  .stat-name span:last-child{color:var(--muted);}
  .bar-outer{
    height:14px;
    background:var(--black);
    border:2px solid var(--blood);
    padding:2px;
  }
  .bar-inner{
    height:100%;
    width:0%;
    background:repeating-linear-gradient(
      90deg, var(--crimson) 0 6px, var(--ember) 6px 8px
    );
    transition:width 1.1s steps(20);
  }
  @media (prefers-reduced-motion: reduce){ .bar-inner{transition:none;} }

  /* ---- inventory / interests grid ---- */
  .inventory{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
  }
  .slot{
    aspect-ratio:1;
    border:2px solid var(--blood);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    position:relative;
    cursor:default;
  }
  .slot:hover{
    border-color:var(--ember);
    background:var(--blood);
  }
  .slot .tip{
    position:absolute;
    bottom:110%;
    left:50%;
    transform:translateX(-50%);
    background:var(--black);
    border:2px solid var(--crimson);
    color:var(--bone);
    font-size:13px;
    font-family:'VT323';
    padding:3px 6px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s;
    z-index:5;
  }
  .slot:hover .tip{opacity:1;}

  /* ---- links menu ---- */
  .menu{list-style:none;margin:0;padding:0;}
  .menu li{margin-bottom:10px;}
  .menu li:last-child{margin-bottom:0;}
  .menu a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    border:2px solid var(--blood);
    padding:10px 12px;
    font-size:19px;
    color:var(--bone);
    background:var(--panel);
    transition:transform .08s, background .08s, border-color .08s;
  }
  .menu a:hover, .menu a:focus-visible{
    background:var(--crimson);
    border-color:var(--ember);
    color:var(--black);
    transform:translateX(4px);
    outline:none;
  }
  .menu a .arrow{opacity:0; transition:opacity .08s;}
  .menu a:hover .arrow, .menu a:focus-visible .arrow{opacity:1;}

  footer{
    text-align:center;
    font-size:15px;
    color:var(--muted);
    padding-top:8px;
  }
  footer .coin{
    font-family:'Press Start 2P';
    font-size:10px;
    color:var(--ember);
    display:block;
    margin-bottom:8px;
  }

  @media (max-width:380px){
    h1.name{font-size:18px;}
    #sprite{grid-template-columns:repeat(11, 7px); grid-template-rows:repeat(11, 7px);}
    #sprite div{width:7px;height:7px;}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="panel titlebar">
    <div class="eyebrow">// LOADING PROFILE.DAT</div>
    <div class="sprite-wrap"><div id="sprite"></div></div>
    <h1 class="name">AHSOORAH</h1>
    <div class="handle">@ahsoorah</div>
    <div class="tagline"><span id="typewriter"></span><span class="cursor">&nbsp;</span></div>
  </div>

  <div class="panel">
    <p class="section-label">CHARACTER STATS</p>
    <div id="stats"></div>
  </div>

  <div class="panel">
    <p class="section-label">FIND ME</p>
    <div class="inventory" id="inventory"></div>
  </div>

  <div class="panel">
    <p class="section-label">FIND ME</p>
    <ul class="menu" id="links"></ul>
  </div>

  <footer>
    <span class="coin blink">be good for me ok?/span>
    &copy; <span id="year"></span> ahsoorah.fyi — i want u
  </footer>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- pixel sprite: 11x11 skull ---------- */
  const rows = [
    "..OOOOOOO..",
    ".OOOOOOOOO.",
    "OOOOOOOOOOO",
    "OOO.OOO.OOO",
    "OOOXOOOXOOO",
    "OOOOOOOOOOO",
    "OOOOOOOOOOO",
    "OOO.O.O.OOO",
    ".OO.O.O.OO.",
    "..O..O..O..",
    "..O..O..O.."
  ];
  const spriteEl = document.getElementById('sprite');
  rows.forEach(row=>{
    [...row].forEach(ch=>{
      const d = document.createElement('div');
      if(ch === 'O') d.className = 'p-on';
      else if(ch === 'X') d.className = 'p-eye';
      else d.className = 'p-off';
      spriteEl.appendChild(d);
    });
  });

  /* ---------- typewriter tagline ---------- */
  const line = "hey champs";
  const tw = document.getElementById('typewriter');
  if(reduceMotion){
    tw.textContent = line;
  } else {
    let i = 0;
    (function type(){
      if(i <= line.length){
        tw.textContent = line.slice(0, i);
        i++;
        setTimeout(type, 32);
      }
    })();
  }

  /* ---------- stats ---------- */
  const stats = [
    { name: "STRENGTH", val: 88 },
    { name: "STRENGTH", val: 12 },
    { name: "STRENGTH", val: 61 },
    { name: "STRENGTH", val: 40 },
    { name: "SPEED", val: 99 }
  ];
  const statsEl = document.getElementById('stats');
  stats.forEach(s=>{
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div class="stat-name"><span>${s.name}</span><span>${s.val}/100</span></div>
      <div class="bar-outer"><div class="bar-inner" style="width:0%"></div></div>
    `;
    statsEl.appendChild(row);
  });
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      document.querySelectorAll('.bar-inner').forEach((bar, idx)=>{
        bar.style.width = stats[idx].val + '%';
      });
    }, 150);
  });

  /* ---------- / interests ---------- */
  const items = [
    { icon:"🎮", tip:"gaming" },
    { icon:"☕", tip:"caffeine" },
    { icon:"🎧", tip:"music" },
    { icon:"📚", tip:"reading" },
    { icon:"🌙", tip:"night owl" },
    { icon:"🍜", tip:"snacks" },
    { icon:"🖤", tip:"chronic online" },
    { icon:"🎲", tip:"chaos energy" }
  ];
  const invEl = document.getElementById('inventory');
  items.forEach(it=>{
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = `${it.icon}<span class="tip">${it.tip}</span>`;
    invEl.appendChild(slot);
  });

  /* ---------- links menu ---------- */
  const links = [
    { label:"instagram", href:"https://instagram.com/" },
    { label:"twitter / x", href:"https://x.com/" },
    { label:"discord", href:"https://discord.com/" },
    { label:"send an email", href:"mailto:hello@ahsoorah.fyi" }
  ];
  const linksEl = document.getElementById('links');
  links.forEach(l=>{
    const li = document.createElement('li');
    li.innerHTML = `<a href="${l.href}" target="_blank" rel="noopener noreferrer"><span class="arrow">▶</span> ${l.label}</a>`;
    linksEl.appendChild(li);
  });
</script>

</body>
</html>
