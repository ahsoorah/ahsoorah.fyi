<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ahsoorah.fyi</title>
<meta name="description" content="asura's bio">

<meta property="og:title" content="asura">
<meta property="og:description" content="hello?">
<meta property="og:image" content="https://ahsoorah.fyi/dawg.jpg">
<meta name="theme-color" content="#dc143c">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="ahsoorah.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --panel:#0a0605;
    --crimson:#dc143c;
    --blood:#7a0e22;
    --ember:#ff3b57;
    --bone:#ece4d6;
    --muted:#8a4a52;
    --px: 4px; 
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--black);
    color:var(--bone);
    font-family:'VT323', monospace;
    font-size:20px;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
    position:relative;
    overflow-x:hidden;
    line-height:1.35;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:50;
    mix-blend-mode:overlay;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
    z-index:49;
  }

  .display{
    font-family:'Press Start 2P', monospace;
  }

  a{color:inherit;}

  .wrap{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:1;
  }

  .panel{
    background:var(--black);
    border:var(--px) solid var(--crimson);
    box-shadow:
      0 0 0 var(--px) var(--black),
      0 0 0 calc(var(--px) * 2) var(--blood),
      0 0 28px rgba(220,20,60,0.28);
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
    margin-bottom:24px;
    padding:20px;
  }

  .panel + .panel{margin-top:24px;}

  .titlebar{
    text-align:center;
    padding-bottom:6px;
  }
  .blink{
    animation:blink 1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .blink{animation:none;} }
  @keyframes blink{ 50%{opacity:0;} }

  .eyebrow{
    font-family:'Press Start 2P';
    font-size:9px;
    letter-spacing:2px;
    color:var(--muted);
    text-align:center;
    margin-bottom:10px;
  }

  .sprite-wrap{
    display:flex;
    justify-content:center;
    margin:10px 0 18px;
  }
  
  .profile-pic {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border: 2px solid var(--blood);
    border-radius: 8px;
    filter: drop-shadow(0 0 10px rgba(220,20,60,0.55));
  }

  h1.name{
    font-family:'Press Start 2P';
    font-size:22px;
    text-align:center;
    color:var(--bone);
    text-shadow: 0 0 10px rgba(220,20,60,0.6), 3px 3px 0 var(--blood);
    margin:0 0 6px;
    letter-spacing:1px;
  }

  .handle{
    text-align:center;
    color:var(--crimson);
    font-size:20px;
    margin-bottom:14px;
  }

  .tagline{
    text-align:center;
    min-height:1.4em;
    color:var(--bone);
    font-size:20px;
    border-top:2px dashed var(--blood);
    border-bottom:2px dashed var(--blood);
    padding:10px 4px;
  }
  .cursor{
    display:inline-block;
    width:2px;
    background:var(--ember);
    margin-left:2px;
    animation:blink 0.8s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .cursor{animation:none; opacity:1;} }

  .section-label{
    font-family:'Press Start 2P';
    font-size:11px;
    color:var(--ember);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::before{content:"▸";}

  .menu{list-style:none;margin:0;padding:0;}
  .menu li{margin-bottom:10px;}
  .menu li:last-child{margin-bottom:0;}
  .menu a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    border:2px solid var(--blood);
    padding:10px 12px;
    font-size:19px;
    color:var(--bone);
    background:var(--panel);
    transition:transform .08s, background .08s, border-color .08s;
  }
  .menu a:hover, .menu a:focus-visible{
    background:var(--crimson);
    border-color:var(--ember);
    color:var(--black);
    transform:translateX(4px);
    outline:none;
  }

  .menu-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bone);
    transition: color .08s;
  }

  .menu-icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .menu a:hover .menu-icon, .menu a:focus-visible .menu-icon{
    color: var(--black);
  }

  .menu a .arrow{opacity:0; transition:opacity .08s; margin-left:auto;}
  .menu a:hover .arrow, .menu a:focus-visible .arrow{opacity:1;}

  .subdomains-list{list-style:none;margin:0;padding:0;}
  .subdomains-list li{margin-bottom:10px;}
  .subdomains-list li:last-child{margin-bottom:0;}
  .subdomain-item{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    border:2px solid var(--blood);
    padding:10px 12px;
    color:var(--bone);
    background:var(--panel);
    transition:transform .08s, background .08s, border-color .08s;
  }
  .subdomain-item:hover, .subdomain-item:focus-visible{
    background:var(--crimson);
    border-color:var(--ember);
    color:var(--black);
    transform:translateX(4px);
    outline:none;
  }
  .subdomain-content{
    display:flex;
    flex-direction:column;
    gap:2px;
    text-align:left;
  }
  .subdomain-url{
    font-size:19px;
    font-weight:bold;
    color:var(--bone);
  }
  .subdomain-item:hover .subdomain-url, .subdomain-item:focus-visible .subdomain-url{
    color:var(--black);
  }
  .subdomain-desc{
    font-size:18px;
    color:var(--muted);
  }
  .subdomain-item:hover .subdomain-desc, .subdomain-item:focus-visible .subdomain-desc{
    color:var(--black);
  }
  .subdomain-arrow{opacity:0; transition:opacity .08s; flex-shrink:0; margin-left:auto;}
  .subdomain-item:hover .subdomain-arrow, .subdomain-item:focus-visible .subdomain-arrow{opacity:1;}

  footer{
    text-align:center;
    font-size:18px;
    color:var(--muted);
    padding-top:8px;
  }
  footer .coin{
    font-family:'Press Start 2P';
    font-size:10px;
    color:var(--ember);
    display:block;
    margin-bottom:8px;
  }

  @media (max-width:380px){
    h1.name{font-size:18px;}
    .profile-pic { width: 85px; height: 85px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="panel titlebar">
    <div class="eyebrow">// me</div>
    <div class="sprite-wrap"><img src="dawg.jpg" alt="dawg" class="profile-pic"></div>
    <h1 class="name">asura</h1>
    <div class="handle">@ahsoorah</div>
    <div class="tagline"><span id="typewriter"></span><span class="cursor">&nbsp;</span></div>
  </div>

  <div class="panel">
    <p class="section-label">ACTIVE SUBDOMAINS</p>
    <ul class="subdomains-list" id="subdomains"></ul>
  </div>

  <div class="panel">
    <p class="section-label">REACH OUT PROFESSIONALLY</p>
    <ul class="menu" id="links"></ul>
  </div>

  <footer>
    <span class="coin blink">be good for me</span>
    &copy; <span id="year"></span> ahsoorah.fyi - i want u
  </footer>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const fullLine = "hey champs. basically lmk if u would like to be friends on discord but please dont ask me to play shi with u. they call me the lone wolf of gaming. <- aura";
  const tw = document.getElementById('typewriter');

  // storage key / cookie name
  const STORAGE_KEY = 'bio_typing_played_v1';

  function markPlayed() {
    try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
    try { document.cookie = STORAGE_KEY + '=1; max-age=' + (60*60*24*365) + '; path=/'; } catch (e) {}
  }
  function hasPlayed() {
    try { if (localStorage.getItem(STORAGE_KEY)) return true; } catch(e){}
    try { if (document.cookie.split(';').some(c=>c.trim().startsWith(STORAGE_KEY+'='))) return true; } catch(e){}
    return false;
  }

  // Typing animation with single simulated typo (now random but plausible)
  async function playTypingWithTypo(line, typoWord, typoReplacement, options = {}){
    const baseDelay = options.baseDelay || 32;
    const pauseAfterTypo = options.pauseAfterTypo || 700; // ms pause to "acknowledge" typo
    const backspaceDelay = options.backspaceDelay || 80;

    // find the correct word index
    const wordIndex = line.indexOf(typoWord);
    if(wordIndex === -1){
      // no word to typo; fallback to plain typing
      await typeString(line, baseDelay);
      return;
    }

    const before = line.slice(0, wordIndex);
    const after = line.slice(wordIndex + typoWord.length);

    // type before
    await typeString(before, baseDelay);

    // type the typo instead of the real word
    await typeString(typoReplacement, baseDelay);

    // brief pause to "notice" the typo
    await wait(pauseAfterTypo);

    // backspace the typo
    for(let i = 0; i < typoReplacement.length; i++){
      await backspaceOnce(backspaceDelay);
    }

    // type the correct word
    await typeString(typoWord, baseDelay);

    // continue with the remainder
    await typeString(after, baseDelay);
  }

  function wait(ms){ return new Promise(res=>setTimeout(res, ms)); }

  async function typeString(str, delay){
    for(let i=0;i<str.length;i++){
      tw.textContent += str[i];
      await wait(delay + Math.floor(Math.random()*8));
    }
  }

  function backspaceOnce(delay){
    return new Promise(res=>{
      setTimeout(()=>{
        tw.textContent = tw.textContent.slice(0, -1);
        res();
      }, delay);
    });
  }

  (async function runTyping(){
    if(reduceMotion || hasPlayed()){
      // if user prefers reduced motion OR we've already played, show full text immediately
      tw.textContent = fullLine;
      markPlayed();
      return;
    }

    // choose a word to typo: pick randomly from matches of preferred words
    const preferred = ['ask','friends','discord','lmk'];
    const candidates = preferred.filter(w=> fullLine.indexOf(w) !== -1);
    let chosen;
    if(candidates.length){
      chosen = candidates[Math.floor(Math.random()*candidates.length)];
    } else {
      // fallback: pick a random word of the line with length >=3
      const words = fullLine.split(/\s+/).filter(w=> w.replace(/[^a-zA-Z]/g,'').length >= 3);
      chosen = words.length ? words[Math.floor(Math.random()*words.length)].replace(/[^a-zA-Z]/g,'') : 'ask';
    }

    // construct a plausible typo for the chosen word using multiple strategies
    function makeTypo(word){
      if(!word) return word + 'j';
      const swapMap = {'k':'j','j':'k','s':'a','a':'s','e':'r','r':'e','i':'o','o':'p','u':'y','y':'t','t':'r','n':'m','m':'n','l':'k','p':'o','d':'s'};
      const strategies = [
        // swap two adjacent letters
        w => {
          const a = w.split('');
          if(a.length < 2) return w + 'j';
          const i = Math.floor(Math.random()*(a.length-1));
          [a[i], a[i+1]] = [a[i+1], a[i]];
          return a.join('');
        },
        // replace a letter with keyboard-adjacent letter
        w => {
          const a = w.split('');
          const i = Math.floor(Math.random()*a.length);
          const lower = a[i].toLowerCase();
          if(swapMap[lower]){
            const repl = swapMap[lower];
            a[i] = (a[i] === a[i].toUpperCase()) ? repl.toUpperCase() : repl;
            return a.join('');
          }
          // fallback to swapping
          if(a.length > 1){ const j = (i+1<a.length)? i+1 : i-1; [a[i],a[j]]=[a[j],a[i]]; }
          return a.join('');
        },
        // duplicate a letter
        w => {
          const a = w.split('');
          const i = Math.floor(Math.random()*a.length);
          a.splice(i, 0, a[i]);
          return a.join('');
        },
        // insert a nearby plausible character
        w => {
          const a = w.split('');
          const i = Math.floor(Math.random()*(a.length+1));
          const candidates = Object.keys(swapMap);
          const pick = candidates[Math.floor(Math.random()*candidates.length)];
          a.splice(i,0,pick);
          return a.join('');
        }
      ];
      return strategies[Math.floor(Math.random()*strategies.length)](word);
    }

    const typo = makeTypo(chosen);

    await playTypingWithTypo(fullLine, chosen, typo, { baseDelay:32, pauseAfterTypo:700, backspaceDelay:80 });

    markPlayed();
  })();

  // --- Subdomains rendering (fixed to avoid innerHTML truncation issues) ---
  const subdomains = [
    { url:"manager.ahsoorah.fyi", desc:"fuck off", href:"https://manager.ahsoorah.fyi" },
    { url:"clips.ahsoorah.fyi", desc:"my medal.tv replacement" }
  ];
  const subdomainsEl = document.getElementById('subdomains');
  subdomains.forEach(s=>{
    const li = document.createElement('li');
    const tag = s.href ? 'a' : 'div';
    const el = document.createElement(tag);
    el.className = 'subdomain-item';
    if(s.href){ el.href = s.href; el.target = '_blank'; el.rel = 'noopener noreferrer'; }

    const content = document.createElement('div');
    content.className = 'subdomain-content';

    const urlEl = document.createElement('span');
    urlEl.className = 'subdomain-url';
    urlEl.textContent = s.url;

    const descEl = document.createElement('span');
    descEl.className = 'subdomain-desc';
    descEl.textContent = s.desc || '';

    content.appendChild(urlEl);
    content.appendChild(descEl);

    const arrow = document.createElement('span');
    arrow.className = 'subdomain-arrow';
    arrow.textContent = '▶';

    el.appendChild(content);
    el.appendChild(arrow);
    li.appendChild(el);
    subdomainsEl.appendChild(li);
  });

  // --- Links with SVG icons (official Simple Icons brand marks) ---
  const links = [
    { 
      label:"steam", 
      svg:'<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z"/></svg>',
      href:"https://steamcommunity.com/id/ahsoorah/" 
    },
    { 
      label:"x", 
      svg:'<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>',
      href:"https://x.com/ahsoorah" 
    },
    { 
      label:"youtube", 
      svg:'<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
      href:"https://www.youtube.com/@ahsoorah" 
    },
    { 
      label:"discord: @ahsoorah", 
      svg:'<svg role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>',
      href:"https://discord.com/" 
    }
  ];
  const linksEl = document.getElementById('links');
  links.forEach(l=>{
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = l.href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    
    const icon = document.createElement('span');
    icon.className = 'menu-icon';
    icon.innerHTML = l.svg;
    
    const label = document.createElement('span');
    label.textContent = escapeHtml(l.label);
    
    const arrow = document.createElement('span');
    arrow.className = 'arrow';
    arrow.textContent = '▶';
    
    a.appendChild(icon);
    a.appendChild(label);
    a.appendChild(arrow);
    li.appendChild(a);
    linksEl.appendChild(li);
  });

  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

</script>

</html>
