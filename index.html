<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ahsoorah.fyi</title>
<meta name="description" content="asura's bio">

<meta property="og:title" content="asura">
<meta property="og:description" content="hello?">
<meta property="og:image" content="https://ahsoorah.fyi/dawg.jpg">
<meta name="theme-color" content="#dc143c">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="ahsoorah.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --panel:#0a0605;
    --crimson:#dc143c;
    --blood:#7a0e22;
    --ember:#ff3b57;
    --bone:#ece4d6;
    --muted:#8a4a52;
    --px: 4px; 
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--black);
    color:var(--bone);
    font-family:'VT323', monospace;
    font-size:20px;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
    position:relative;
    overflow-x:hidden;
    line-height:1.35;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.035) 0px,
      rgba(255,255,255,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:50;
    mix-blend-mode:overlay;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
    z-index:49;
  }

  .display{
    font-family:'Press Start 2P', monospace;
  }

  a{color:inherit;}

  .wrap{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:1;
  }

  .panel{
    background:var(--black);
    border:var(--px) solid var(--crimson);
    box-shadow:
      0 0 0 var(--px) var(--black),
      0 0 0 calc(var(--px) * 2) var(--blood),
      0 0 28px rgba(220,20,60,0.28);
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
    margin-bottom:24px;
    padding:20px;
  }

  .panel + .panel{margin-top:24px;}

  .titlebar{
    text-align:center;
    padding-bottom:6px;
  }
  .blink{
    animation:blink 1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .blink{animation:none;} }
  @keyframes blink{ 50%{opacity:0;} }

  .eyebrow{
    font-family:'Press Start 2P';
    font-size:9px;
    letter-spacing:2px;
    color:var(--muted);
    text-align:center;
    margin-bottom:10px;
  }

  .sprite-wrap{
    display:flex;
    justify-content:center;
    margin:10px 0 18px;
  }
  
  .profile-pic {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border: 2px solid var(--blood);
    border-radius: 8px;
    filter: drop-shadow(0 0 10px rgba(220,20,60,0.55));
  }

  h1.name{
    font-family:'Press Start 2P';
    font-size:22px;
    text-align:center;
    color:var(--bone);
    text-shadow: 0 0 10px rgba(220,20,60,0.6), 3px 3px 0 var(--blood);
    margin:0 0 6px;
    letter-spacing:1px;
  }

  .handle{
    text-align:center;
    color:var(--crimson);
    font-size:20px;
    margin-bottom:14px;
  }

  .tagline{
    text-align:center;
    min-height:1.4em;
    color:var(--bone);
    font-size:20px;
    border-top:2px dashed var(--blood);
    border-bottom:2px dashed var(--blood);
    padding:10px 4px;
  }
  .cursor{
    display:inline-block;
    width:4px;
    background:var(--ember);
    margin-left:2px;
    animation:blink 0.8s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .cursor{animation:none; opacity:1;} }

  .section-label{
    font-family:'Press Start 2P';
    font-size:11px;
    color:var(--ember);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::before{content:"▸";}

  .menu{list-style:none;margin:0;padding:0;}
  .menu li{margin-bottom:10px;}
  .menu li:last-child{margin-bottom:0;}
  .menu a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    border:2px solid var(--blood);
    padding:10px 12px;
    font-size:19px;
    color:var(--bone);
    background:var(--panel);
    transition:transform .08s, background .08s, border-color .08s;
  }
  .menu a:hover, .menu a:focus-visible{
    background:var(--crimson);
    border-color:var(--ember);
    color:var(--black);
    transform:translateX(4px);
    outline:none;
  }
  .menu a .arrow{opacity:0; transition:opacity .08s;}
  .menu a:hover .arrow, .menu a:focus-visible .arrow{opacity:1;}

  .subdomains-list{list-style:none;margin:0;padding:0;}
  .subdomains-list li{margin-bottom:10px;}
  .subdomains-list li:last-child{margin-bottom:0;}
  .subdomain-item{
    display:block;
    border:2px solid var(--blood);
    padding:10px 12px;
    font-size:19px;
    color:var(--bone);
    background:var(--panel);
    text-decoration:none;
    transition:transform .08s, background .08s, border-color .08s;
  }
  .subdomain-item:hover, .subdomain-item:focus-visible{
    background:var(--crimson);
    border-color:var(--ember);
    color:var(--black);
    transform:translateX(4px);
    outline:none;
  }
  .subdomain-url{
    display:block;
    font-weight:bold;
    color:var(--ember);
    margin-bottom:4px;
  }
  .subdomain-desc{
    display:block;
    font-size:18px;
    color:var(--muted);
  }

  footer{
    text-align:center;
    font-size:18px;
    color:var(--muted);
    padding-top:8px;
  }
  footer .coin{
    font-family:'Press Start 2P';
    font-size:10px;
    color:var(--ember);
    display:block;
    margin-bottom:8px;
  }

  @media (max-width:380px){
    h1.name{font-size:18px;}
    .profile-pic { width: 85px; height: 85px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="panel titlebar">
    <div class="eyebrow">// PROFILE</div>
    <div class="sprite-wrap"><img src="dawg.jpg" alt="dawg" class="profile-pic"></div>
    <h1 class="name">asura</h1>
    <div class="handle">@ahsoorah</div>
    <div class="tagline"><span id="typewriter"></span><span class="cursor">&nbsp;</span></div>
  </div>

  <div class="panel">
    <p class="section-label">ACTIVE SUBDOMAINS</p>
    <ul class="subdomains-list" id="subdomains"></ul>
  </div>

  <div class="panel">
    <p class="section-label">REACH OUT PROFESSIONALLY</p>
    <ul class="menu" id="links"></ul>
  </div>

  <footer>
    <span class="coin blink">be good for me</span>
    &copy; <span id="year"></span> ahsoorah.fyi - i want u
  </footer>

</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const line = "hey champs. basically lmk if u would like to be friends on discord but please dont ask me to play shi with u. they call me the lone wolf of gaming. <- aura";
  const tw = document.getElementById('typewriter');
  if(reduceMotion){
    tw.textContent = line;
  } else {
    let i = 0;
    (function type(){
      if(i <= line.length){
        tw.textContent = line.slice(0, i);
        i++;
        setTimeout(type, 32);
      }
    })();
  }

  const subdomains = [
    { url:"manager.ahsoorah.fyi", desc:"fuck off", href:"https://manager.ahsoorah.fyi" },
    { url:"clips.ahsoorah.fyi", desc:"my medal.tv replacement" }
  ];
  const subdomainsEl = document.getElementById('subdomains');
  subdomains.forEach(s=>{
    const li = document.createElement('li');
    const href = s.href ? ` href="${s.href}" target="_blank" rel="noopener noreferrer"` : "";
    const tag = s.href ? 'a' : 'div';
    li.innerHTML = `<${tag} class="subdomain-item"${href}><span class="subdomain-url">${s.url}</span><span class="subdomain-desc">${s.desc}</span></${tag}>`;
    subdomainsEl.appendChild(li);
  });

  const links = [
    { label:"steam", href:"https://steamcommunity.com/id/ahsoorah/" },
    { label:"x", href:"https://x.com/ahsoorah" },
    { label:"youtube", href:"https://www.youtube.com/@ahsoorah" },
    { label:"discord: @su.ri", href:"https://discord.com/" }
  ];
  const linksEl = document.getElementById('links');
  links.forEach(l=>{
    const li = document.createElement('li');
    li.innerHTML = `<a href="${l.href}" target="_blank" rel="noopener noreferrer"><span class="arrow">▶</span> ${l.label}</a>`;
    linksEl.appendChild(li);
  });
</script>

</body>
</html>
